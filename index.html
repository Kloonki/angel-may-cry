<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивный фон</title>
    <style>
        /* Убираем стандартные отступы и задаем красный фон для всех устройств */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: red;
        }

        /* Меняем фон на синий, если ширина экрана 768px или меньше (телефоны) */
        @media (max-width: 768px) {
            body {
                background-color: blue;
            }
        }
    </style>
</head>
<body>
</body>
</html>
